apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
    spec:
      containers:
      - name: web
        image: nginx:1.25
        ports:
        - containerPort: 80
  strategy:
    canary:
      stableService: rollout-demo-stable
      canaryService: rollout-demo-canary
      trafficRouting:
        istio:
          virtualServices:
          - name: rollout-vsvc
            routes:
            - primary
    steps:
    - setWeight: 20
    - pause: {duration 300s}
    - setWeight: 50
    - pause: {duration: 30s}
    - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-demo-stable
spec:
  selector:
    app: rollout-demo
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-demo-canary
spec:
  selector:
    app: rollout-demo
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: rollout-vsvc
spec:
  hosts:
  - rollout-demo
  http:
  - name: primary
    route:
    - destination: 
        host: rollout-demo-stable
      weight: 100
    - destination:
        host: rollout-demo-canary
      weight: 0
