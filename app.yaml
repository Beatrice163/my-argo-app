apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: my-web-app
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80        
